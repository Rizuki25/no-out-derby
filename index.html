<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0b0e14" />
    <link rel="icon" href="./favicon.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>No-Out Derby — Futsal Pantul</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }

      /* Only the playable surface and its controls swallow gestures.
         Page-level pinch-zoom stays available for accessibility. */
      canvas#game-canvas,
      #touch-controls,
      #touch-controls *,
      #mobile-menu-bar,
      #mobile-menu-bar * {
        touch-action: none;
      }

      html,
      body {
        width: 100%;
        height: 100vh;
        height: 100dvh;
        background-color: #0b0e14;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      html.immersive-fallback,
      html.immersive-fallback body,
      html:fullscreen,
      html:fullscreen body,
      html:-webkit-full-screen,
      html:-webkit-full-screen body {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        background-color: #06090e;
      }

      #game-wrapper {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at center, #141b26 0%, #090c11 100%);
      }

      #game-wrapper.in-match-deck {
        flex-direction: column;
        justify-content: flex-start;
        padding-top: max(8px, env(safe-area-inset-top));
      }

      canvas#game-canvas {
        display: block;
        image-rendering: -moz-crisp-edges;
        image-rendering: -webkit-crisp-edges;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        box-shadow: 0 0 0 2px #263244, 0 18px 48px rgba(0, 0, 0, 0.75);
        background-color: #0f141e;
        cursor: pointer;
      }

      /* Mobile / Touch Controller Overlay */
      #touch-controls {
        display: none;
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 20;
      }

      #touch-controls.active {
        display: block;
      }

      /* Portrait Handheld Deck Mode (zero overlap over pitch) */
      #touch-controls.active.portrait {
        top: 46dvh;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 8px max(14px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom))
          max(14px, env(safe-area-inset-left));
        background: linear-gradient(180deg, #111826 0%, #090d14 100%);
        border-top: 2px solid #2a3950;
        pointer-events: auto;
      }

      .touch-zone {
        pointer-events: auto;
        cursor: pointer;
      }

      /* Utility Bar (Pause / Mute / View) */
      #touch-utility-bar {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        flex-wrap: wrap;
        pointer-events: none;
      }

      #touch-controls.landscape #touch-utility-bar {
        position: absolute;
        left: 50%;
        bottom: max(12px, env(safe-area-inset-bottom));
        transform: translateX(-50%);
      }

      .touch-pill {
        pointer-events: auto;
        height: 28px;
        padding: 0 10px;
        border-radius: 6px;
        border: 2px solid rgba(140, 165, 200, 0.45);
        background: rgba(15, 21, 33, 0.86);
        color: #eaf2ff;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.6px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 2px 0 rgba(0, 0, 0, 0.55);
      }

      .touch-pill:active,
      .touch-pill.pressed {
        transform: translateY(1px) scale(0.96);
        border-color: #f4b41b;
        color: #f4b41b;
      }

      .touch-pill.muted {
        border-color: rgba(224, 60, 74, 0.7);
        color: #ff8c96;
      }

      .touch-pill.fs {
        border-color: rgba(98, 224, 245, 0.55);
        color: #9beeff;
      }

      .touch-pill.tac {
        border-color: rgba(140, 165, 200, 0.55);
        color: #cfe3ff;
      }

      .touch-pill.tac.atk {
        border-color: rgba(245, 118, 70, 0.85);
        color: #ffb899;
      }

      .touch-pill.tac.def {
        border-color: rgba(98, 224, 245, 0.85);
        color: #9beeff;
      }

      .touch-pill.fs.active,
      .mobile-fs-btn.active {
        border-color: #39d98a;
        background: rgba(16, 48, 36, 0.92);
        color: #7dffba;
      }

      /* Mobile Menu / Pause Fullscreen Bar */
      #mobile-menu-bar {
        display: none;
        position: fixed;
        z-index: 25;
        align-items: center;
        justify-content: center;
        gap: 8px;
        pointer-events: none;
      }

      #mobile-menu-bar.active {
        display: flex;
      }

      #mobile-menu-bar.portrait {
        left: 0;
        right: 0;
        bottom: max(14px, env(safe-area-inset-bottom));
        padding: 0 12px;
        flex-wrap: wrap;
      }

      #mobile-menu-bar.landscape {
        right: max(12px, env(safe-area-inset-right));
        bottom: max(10px, env(safe-area-inset-bottom));
      }

      .mobile-fs-btn {
        pointer-events: auto;
        height: 36px;
        padding: 0 14px;
        border-radius: 8px;
        border: 2px solid rgba(98, 224, 245, 0.75);
        background: rgba(13, 24, 38, 0.92);
        color: #9beeff;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.7px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 3px 0 rgba(0, 0, 0, 0.65);
        cursor: pointer;
      }

      #mobile-menu-bar.portrait .mobile-fs-btn {
        height: 42px;
        padding: 0 18px;
        font-size: 13px;
      }

      #mobile-menu-bar.portrait #mobile-menu-pad {
        height: 42px;
        padding: 0 12px;
        font-size: 12px;
      }

      .mobile-fs-btn:active {
        transform: translateY(1px) scale(0.97);
      }

      /* Sandbox Special Quick Bar */
      #touch-sandbox-bar {
        display: none;
        align-items: center;
        justify-content: center;
        gap: 5px;
        flex-wrap: wrap;
        pointer-events: none;
      }

      #touch-controls.landscape #touch-sandbox-bar {
        position: absolute;
        left: 50%;
        bottom: calc(max(12px, env(safe-area-inset-bottom)) + 34px);
        transform: translateX(-50%);
        max-width: 62vw;
      }

      .sandbox-btn {
        pointer-events: auto;
        height: 24px;
        padding: 0 7px;
        border-radius: 5px;
        border: 1.5px solid rgba(98, 224, 245, 0.55);
        background: rgba(16, 26, 40, 0.88);
        color: #8df0ff;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.4px;
      }

      .sandbox-btn.mut {
        border-color: rgba(244, 180, 27, 0.55);
        color: #ffd666;
      }

      .sandbox-btn.clr {
        border-color: rgba(224, 60, 74, 0.65);
        color: #ff8d97;
      }

      .sandbox-btn:active {
        transform: scale(0.94);
        background: rgba(52, 144, 240, 0.5);
      }

      /* Replay Skip Bar */
      #touch-replay-bar {
        display: none;
        align-items: center;
        justify-content: center;
      }

      #touch-controls.landscape #touch-replay-bar {
        position: absolute;
        left: 50%;
        bottom: max(54px, calc(env(safe-area-inset-bottom) + 46px));
        transform: translateX(-50%);
      }

      #touch-skip {
        min-width: 170px;
        height: 44px;
        padding: 0 18px;
        border-radius: 10px;
        border: 2px solid #f4b41b;
        background: rgba(20, 28, 42, 0.92);
        color: #ffd666;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.8px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.55);
      }

      #touch-skip:active {
        transform: scale(0.95);
        background: rgba(244, 180, 27, 0.25);
      }

      /* Play Pad (Joystick + Action Cluster) */
      #touch-play-pad {
        position: relative;
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 136px;
        pointer-events: none;
      }

      #touch-controls.landscape #touch-play-pad {
        position: absolute;
        inset: 0;
      }

      #touch-stick-base {
        position: relative;
        width: 120px;
        height: 120px;
        border-radius: 50%;
        border: 3px solid rgba(141, 240, 255, 0.35);
        background: radial-gradient(circle, rgba(22, 32, 48, 0.65) 0%, rgba(11, 14, 20, 0.78) 100%);
        box-shadow: inset 0 0 18px rgba(0, 0, 0, 0.65), 0 0 0 2px rgba(11, 14, 20, 0.75);
      }

      #touch-controls.portrait #touch-stick-base {
        width: 112px;
        height: 112px;
        margin-left: 2px;
      }

      #touch-controls.landscape #touch-stick-base {
        position: absolute;
        left: max(18px, env(safe-area-inset-left));
        bottom: max(18px, env(safe-area-inset-bottom));
        opacity: 0.86;
      }

      .stick-arrow {
        position: absolute;
        color: rgba(180, 210, 240, 0.34);
        font-size: 10px;
        font-weight: bold;
        pointer-events: none;
      }

      .stick-arrow.up {
        top: 6px;
        left: 50%;
        transform: translateX(-50%);
      }

      .stick-arrow.down {
        bottom: 6px;
        left: 50%;
        transform: translateX(-50%);
      }

      .stick-arrow.left {
        left: 7px;
        top: 50%;
        transform: translateY(-50%);
      }

      .stick-arrow.right {
        right: 7px;
        top: 50%;
        transform: translateY(-50%);
      }

      #touch-stick-knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 48px;
        height: 48px;
        margin-left: -24px;
        margin-top: -24px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #ffffff 0%, #9ad9ff 45%, #347ec2 100%);
        border: 2px solid #f4f8ff;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.65);
        pointer-events: none;
      }

      #touch-action-pad {
        position: relative;
        width: 214px;
        height: 142px;
        pointer-events: none;
      }

      #touch-controls.landscape #touch-action-pad {
        position: absolute;
        right: max(18px, env(safe-area-inset-right));
        bottom: max(16px, env(safe-area-inset-bottom));
      }

      .touch-btn {
        position: absolute;
        border-radius: 14px;
        border: 3px solid rgba(255, 255, 255, 0.45);
        color: #ffffff;
        font-weight: 800;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        opacity: 0.9;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.55), 0 8px 18px rgba(0, 0, 0, 0.45);
        transition: transform 0.06s ease, opacity 0.1s ease;
      }

      .touch-btn.pressed {
        transform: translateY(2px) scale(0.94);
        opacity: 1;
        border-color: #ffffff;
      }

      .touch-btn.on-cd {
        opacity: 0.48;
      }

      .touch-btn-sub {
        font-size: 9px;
        font-weight: 700;
        opacity: 0.85;
        letter-spacing: 0.3px;
      }

      #touch-kick {
        right: 2px;
        bottom: 8px;
        width: 74px;
        height: 74px;
        font-size: 14px;
        background: linear-gradient(180deg, rgba(235, 74, 88, 0.92) 0%, rgba(168, 28, 42, 0.92) 100%);
        overflow: hidden;
      }

      #touch-kick-charge {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 0%;
        background: rgba(244, 180, 27, 0.55);
        pointer-events: none;
        z-index: 0;
      }

      #touch-kick > span {
        position: relative;
        z-index: 1;
      }

      #touch-dash {
        right: 84px;
        bottom: 6px;
        width: 62px;
        height: 62px;
        font-size: 11px;
        background: linear-gradient(180deg, rgba(58, 152, 245, 0.92) 0%, rgba(28, 92, 168, 0.92) 100%);
      }

      #touch-dash.is-feint {
        background: linear-gradient(180deg, rgba(64, 214, 232, 0.94) 0%, rgba(24, 128, 152, 0.94) 100%);
        border-color: rgba(185, 252, 255, 0.85);
      }

      #touch-pass {
        right: 84px;
        bottom: 76px;
        width: 62px;
        height: 48px;
        border-radius: 12px;
        font-size: 11px;
        background: linear-gradient(180deg, rgba(46, 204, 134, 0.94) 0%, rgba(20, 128, 82, 0.94) 100%);
      }

      #touch-switch {
        right: 2px;
        bottom: 90px;
        width: 74px;
        height: 34px;
        border-radius: 9px;
        font-size: 11px;
        background: linear-gradient(180deg, rgba(244, 180, 27, 0.94) 0%, rgba(181, 121, 12, 0.94) 100%);
        color: #0b0e14;
        border-color: rgba(255, 240, 185, 0.85);
      }

      #touch-fever {
        right: 152px;
        bottom: 14px;
        width: 58px;
        height: 58px;
        border-radius: 14px;
        font-size: 10px;
        background: linear-gradient(180deg, rgba(58, 66, 86, 0.84) 0%, rgba(28, 34, 48, 0.86) 100%);
        border-color: rgba(160, 180, 210, 0.4);
        opacity: 0.65;
      }

      #touch-fever.ready {
        background: linear-gradient(180deg, rgba(255, 198, 44, 0.96) 0%, rgba(214, 108, 12, 0.96) 100%);
        border-color: #fff3b0;
        color: #0b0e14;
        opacity: 1;
        box-shadow: 0 0 14px rgba(255, 198, 44, 0.72), 0 4px 0 rgba(0, 0, 0, 0.55);
      }

      #touch-fever.burning {
        background: linear-gradient(180deg, rgba(255, 110, 42, 0.96) 0%, rgba(196, 36, 24, 0.96) 100%);
        border-color: #ffd666;
        color: #ffffff;
        opacity: 1;
      }

      #touch-controls.portrait #touch-kick {
        width: 76px;
        height: 76px;
        bottom: 8px;
      }

      #touch-controls.portrait #touch-dash {
        width: 62px;
        height: 62px;
        right: 84px;
        bottom: 6px;
      }

      #touch-controls.portrait #touch-switch {
        bottom: 92px;
      }

      /* Online P2P Lobby Modal */
      #online-modal {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 45;
        background: rgba(6, 9, 14, 0.88);
        align-items: center;
        justify-content: center;
        padding: 12px;
        touch-action: manipulation;
      }

      #online-modal.open {
        display: flex;
      }

      .online-card {
        width: min(440px, 100%);
        max-height: 92vh;
        overflow-y: auto;
        background: #101622;
        border: 2px solid #ffd23f;
        box-shadow: 0 0 0 2px #090d14, 0 18px 46px rgba(0, 0, 0, 0.85);
        color: #f4f7ff;
        padding: 14px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      .online-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        border-bottom: 2px solid #243044;
        padding-bottom: 8px;
        margin-bottom: 10px;
      }

      .online-title {
        color: #ffd23f;
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0.5px;
      }

      .online-btn {
        cursor: pointer;
        border: 1.5px solid #4a5c7a;
        background: #1a2436;
        color: #e6eefc;
        font: inherit;
        font-size: 12px;
        font-weight: 700;
        padding: 7px 10px;
        touch-action: manipulation;
      }

      .online-btn:hover:not(:disabled) {
        border-color: #ffd23f;
        color: #ffffff;
      }

      .online-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .online-btn.primary {
        background: #1b6b3a;
        border-color: #56f09e;
        color: #ffffff;
      }

      .online-btn.cyan {
        background: #124861;
        border-color: #38d9ff;
        color: #ffffff;
      }

      .online-btn.danger {
        background: #611924;
        border-color: #ff647c;
        color: #ffffff;
      }

      .online-tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 10px;
      }

      .online-tab.active {
        background: #23334c;
        border-color: #ffd23f;
        color: #ffd23f;
      }

      .online-section-label {
        font-size: 11px;
        color: #8ea4c8;
        margin-bottom: 6px;
        text-transform: uppercase;
      }

      .online-format-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
        gap: 6px;
        margin-bottom: 10px;
      }

      .online-format-pill {
        font-size: 11px;
        padding: 6px 4px;
        text-align: center;
      }

      .online-format-pill.active {
        background: #173a5e;
        border-color: #38d9ff;
        color: #38d9ff;
      }

      .online-summary {
        background: #0a0f18;
        border: 1px solid #26344a;
        padding: 7px 9px;
        font-size: 11px;
        color: #b7c8e6;
        margin-bottom: 10px;
        line-height: 1.4;
      }

      .online-code-box {
        background: #090d14;
        border: 2px solid #38d9ff;
        padding: 12px;
        text-align: center;
        margin: 8px 0 10px;
      }

      .online-code-value {
        font-size: 32px;
        font-weight: 900;
        letter-spacing: 10px;
        color: #ffd23f;
        padding-left: 10px;
      }

      .online-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }

      .online-row > * {
        flex: 1 1 auto;
      }

      #online-code-input {
        width: 130px;
        flex: 0 0 130px;
        background: #090d14;
        border: 2px solid #4a5c7a;
        color: #ffd23f;
        font: inherit;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 5px;
        text-align: center;
        text-transform: uppercase;
        padding: 6px 8px;
        user-select: text;
        -webkit-user-select: text;
        touch-action: manipulation;
      }

      #online-code-input:focus {
        outline: none;
        border-color: #38d9ff;
      }

      #online-status {
        margin-top: 10px;
        padding: 8px 10px;
        background: #0a0f18;
        border: 1px solid #2e3e58;
        font-size: 11px;
        color: #bfe6ff;
        line-height: 1.4;
        min-height: 32px;
      }

      #online-status.error {
        border-color: #ff647c;
        color: #ff9ead;
        background: #220d13;
      }

      #online-status.ok {
        border-color: #56f09e;
        color: #9effcc;
        background: #0c2117;
      }

      #online-nat-badge {
        margin-top: 8px;
        padding: 5px 8px;
        font-size: 10px;
        border: 1px solid #2e3e58;
        background: #0b111b;
        color: #9bb4d8;
      }

      #online-nat-badge.turn-ready {
        border-color: #36c98e;
        color: #8ff5c6;
        background: #0b2018;
      }

      #online-nat-badge.stun-only {
        border-color: #b5882a;
        color: #ffe08a;
        background: #211909;
      }
    </style>
  </head>
  <body>
    <div id="game-wrapper">
      <canvas id="game-canvas" width="480" height="270"></canvas>
    </div>

    <div id="mobile-menu-bar">
      <button id="mobile-menu-fs" type="button" class="mobile-fs-btn">[ ] FULLSCREEN MODE</button>
      <button id="mobile-menu-pad" type="button" class="touch-pill">PAD:AUTO</button>
    </div>

    <div id="touch-controls">
      <div id="touch-utility-bar">
        <button id="touch-pause" type="button" class="touch-pill touch-zone">II PAUSE</button>
        <button id="touch-tactic" type="button" class="touch-pill tac touch-zone" style="display: none;">TAC:BAL</button>
        <button id="touch-mute" type="button" class="touch-pill touch-zone">SFX:ON</button>
        <button id="touch-view" type="button" class="touch-pill touch-zone">VIEW:AUTO</button>
        <button id="touch-fullscreen" type="button" class="touch-pill fs touch-zone">[ ] FULL</button>
      </div>

      <div id="touch-sandbox-bar">
        <button type="button" class="sandbox-btn touch-zone" data-sb="feed">FEED</button>
        <button type="button" class="sandbox-btn touch-zone" data-sb="ball">BALL</button>
        <button type="button" class="sandbox-btn touch-zone" data-sb="def">AI BEK</button>
        <button type="button" class="sandbox-btn mut touch-zone" data-sb="m0">M1:GIANT</button>
        <button type="button" class="sandbox-btn mut touch-zone" data-sb="m1">M2:ICE</button>
        <button type="button" class="sandbox-btn mut touch-zone" data-sb="m2">M3:PIN</button>
        <button type="button" class="sandbox-btn mut touch-zone" data-sb="m3">M4:BOMB</button>
        <button type="button" class="sandbox-btn mut touch-zone" data-sb="m4">M5:WIDE</button>
        <button type="button" class="sandbox-btn mut touch-zone" data-sb="m5">M6:2X</button>
        <button type="button" class="sandbox-btn clr touch-zone" data-sb="clear">CLR</button>
      </div>

      <div id="touch-replay-bar">
        <button id="touch-skip" type="button" class="touch-zone">SKIP REPLAY &gt;&gt;</button>
      </div>

      <div id="touch-play-pad">
        <div id="touch-stick-base" class="touch-zone">
          <span class="stick-arrow up">▲</span>
          <span class="stick-arrow down">▼</span>
          <span class="stick-arrow left">◀</span>
          <span class="stick-arrow right">▶</span>
          <div id="touch-stick-knob"></div>
        </div>

        <div id="touch-action-pad">
          <div id="touch-fever" class="touch-zone touch-btn">
            <span>FEVER</span>
            <span id="touch-fever-sub" class="touch-btn-sub">0%</span>
          </div>
          <div id="touch-pass" class="touch-zone touch-btn">
            <span>PASS</span>
            <span class="touch-btn-sub">TEAM</span>
          </div>
          <div id="touch-switch" class="touch-zone touch-btn" style="display: none;">
            <span>SWITCH</span>
          </div>
          <div id="touch-dash" class="touch-zone touch-btn">
            <span id="touch-dash-label">TACKLE</span>
            <span class="touch-btn-sub">STEAL</span>
          </div>
          <div id="touch-kick" class="touch-zone touch-btn">
            <div id="touch-kick-charge"></div>
            <span>KICK</span>
            <span class="touch-btn-sub">HOLD PWR</span>
          </div>
        </div>
      </div>
    </div>

    <div id="online-modal" role="dialog" aria-modal="true" aria-labelledby="online-modal-title">
      <div class="online-card">
        <div class="online-head">
          <span id="online-modal-title" class="online-title">ONLINE MULTIPLAYER</span>
          <button id="online-close-btn" type="button" class="online-btn">[ESC] TUTUP</button>
        </div>

        <div class="online-tabs">
          <button id="online-tab-host" type="button" class="online-btn online-tab active">BUAT ROOM (HOST)</button>
          <button id="online-tab-join" type="button" class="online-btn online-tab">GABUNG ROOM (JOIN)</button>
        </div>

        <div id="online-host-panel">
          <div class="online-section-label">PILIH FORMAT MATCH ONLINE</div>
          <div id="online-format-grid" class="online-format-grid"></div>
          <div id="online-host-summary" class="online-summary"></div>

          <div id="online-host-idle-actions">
            <button id="online-create-btn" type="button" class="online-btn primary" style="width: 100%; padding: 10px;">
              BUAT ROOM &amp; KODE INVITE
            </button>
          </div>

          <div id="online-host-active-box" style="display: none;">
            <div class="online-code-box">
              <div class="online-section-label" style="margin-bottom: 4px;">KODE ROOM KAMU</div>
              <div id="online-room-code" class="online-code-value">----</div>
            </div>
            <div class="online-row" style="margin-bottom: 8px;">
              <button id="online-copy-link-btn" type="button" class="online-btn cyan">SALIN LINK INVITE</button>
              <button id="online-copy-code-btn" type="button" class="online-btn">SALIN KODE</button>
            </div>
            <button id="online-cancel-host-btn" type="button" class="online-btn danger" style="width: 100%;">
              BATALKAN ROOM
            </button>
          </div>
        </div>

        <div id="online-join-panel" style="display: none;">
          <div class="online-section-label">MASUKKAN KODE ROOM (4 KARAKTER)</div>
          <form id="online-join-form" class="online-row" style="margin-bottom: 8px;">
            <input
              id="online-code-input"
              type="text"
              maxlength="4"
              placeholder="XXXX"
              autocomplete="off"
              autocapitalize="characters"
              spellcheck="false"
            />
            <button id="online-join-btn" type="submit" class="online-btn primary" style="padding: 10px 12px;">
              GABUNG SEKARANG!
            </button>
          </form>
          <div id="online-join-preview" class="online-summary" style="display: none;"></div>
          <button id="online-cancel-join-btn" type="button" class="online-btn danger" style="width: 100%; display: none;">
            BATALKAN KONEKSI
          </button>
        </div>

        <div id="online-nat-badge">JALUR KONEKSI: MENGECEK...</div>
        <div id="online-status">Pilih Buat Room untuk mengundang teman, atau masukkan kode Room teman.</div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
