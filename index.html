<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>No-Out Derby — Futsal Pantul</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background-color: #0b0e14;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: monospace;
      }

      #game-wrapper {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at center, #141b26 0%, #090c11 100%);
      }

      canvas#game-canvas {
        display: block;
        image-rendering: -moz-crisp-edges;
        image-rendering: -webkit-crisp-edges;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        box-shadow: 0 0 0 2px #263244, 0 18px 48px rgba(0, 0, 0, 0.75);
        background-color: #0f141e;
        cursor: pointer;
      }

      /* Mobile / Touch Overlay (hidden unless touch detected) */
      #touch-controls {
        display: none;
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 20;
      }

      #touch-controls.active {
        display: block;
      }

      .touch-zone {
        position: absolute;
        pointer-events: auto;
      }

      #touch-stick-base {
        left: 20px;
        bottom: 24px;
        width: 112px;
        height: 112px;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.25);
        background: rgba(15, 20, 30, 0.35);
      }

      #touch-stick-knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 44px;
        height: 44px;
        margin-left: -22px;
        margin-top: -22px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.55);
        border: 2px solid rgba(255, 255, 255, 0.85);
      }

      .touch-btn {
        width: 68px;
        height: 68px;
        border-radius: 12px;
        border: 3px solid rgba(255, 255, 255, 0.4);
        color: #fff;
        font-weight: bold;
        font-size: 13px;
        letter-spacing: 0.5px;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0.82;
      }

      .touch-btn.pressed {
        transform: scale(0.94);
        opacity: 1;
      }

      #touch-kick {
        right: 24px;
        bottom: 28px;
        background: rgba(224, 60, 74, 0.65);
      }

      #touch-dash {
        right: 106px;
        bottom: 20px;
        background: rgba(52, 144, 240, 0.65);
      }

      #touch-switch {
        right: 32px;
        bottom: 108px;
        width: 52px;
        height: 40px;
        font-size: 11px;
        background: rgba(244, 180, 27, 0.65);
      }
    </style>
  </head>
  <body>
    <div id="game-wrapper">
      <canvas id="game-canvas" width="480" height="270"></canvas>
    </div>
    <div id="touch-controls">
      <div id="touch-stick-base" class="touch-zone">
        <div id="touch-stick-knob"></div>
      </div>
      <div id="touch-kick" class="touch-zone touch-btn">KICK</div>
      <div id="touch-dash" class="touch-zone touch-btn">DASH</div>
      <div id="touch-switch" class="touch-zone touch-btn" style="display: none;">SW</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
