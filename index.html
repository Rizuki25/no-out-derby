<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0b0e14" />
    <title>No-Out Derby — Futsal Pantul</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        touch-action: none;
      }

      html,
      body {
        width: 100%;
        height: 100vh;
        height: 100dvh;
        background-color: #0b0e14;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      #game-wrapper {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at center, #141b26 0%, #090c11 100%);
      }

      #game-wrapper.in-match-deck {
        flex-direction: column;
        justify-content: flex-start;
        padding-top: max(8px, env(safe-area-inset-top));
      }

      canvas#game-canvas {
        display: block;
        image-rendering: -moz-crisp-edges;
        image-rendering: -webkit-crisp-edges;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        box-shadow: 0 0 0 2px #263244, 0 18px 48px rgba(0, 0, 0, 0.75);
        background-color: #0f141e;
        cursor: pointer;
      }

      /* Mobile / Touch Controller Overlay */
      #touch-controls {
        display: none;
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 20;
      }

      #touch-controls.active {
        display: block;
      }

      /* Portrait Handheld Deck Mode (zero overlap over pitch) */
      #touch-controls.active.portrait {
        top: 46dvh;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 8px max(14px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom))
          max(14px, env(safe-area-inset-left));
        background: linear-gradient(180deg, #111826 0%, #090d14 100%);
        border-top: 2px solid #2a3950;
        pointer-events: auto;
      }

      .touch-zone {
        pointer-events: auto;
        cursor: pointer;
      }

      /* Utility Bar (Pause / Mute / View) */
      #touch-utility-bar {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        flex-wrap: wrap;
        pointer-events: none;
      }

      #touch-controls.landscape #touch-utility-bar {
        position: absolute;
        left: 50%;
        bottom: max(12px, env(safe-area-inset-bottom));
        transform: translateX(-50%);
      }

      .touch-pill {
        pointer-events: auto;
        height: 28px;
        padding: 0 10px;
        border-radius: 6px;
        border: 2px solid rgba(140, 165, 200, 0.45);
        background: rgba(15, 21, 33, 0.86);
        color: #eaf2ff;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.6px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 2px 0 rgba(0, 0, 0, 0.55);
      }

      .touch-pill:active,
      .touch-pill.pressed {
        transform: translateY(1px) scale(0.96);
        border-color: #f4b41b;
        color: #f4b41b;
      }

      .touch-pill.muted {
        border-color: rgba(224, 60, 74, 0.7);
        color: #ff8c96;
      }

      /* Sandbox Special Quick Bar */
      #touch-sandbox-bar {
        display: none;
        align-items: center;
        justify-content: center;
        gap: 5px;
        flex-wrap: wrap;
        pointer-events: none;
      }

      #touch-controls.landscape #touch-sandbox-bar {
        position: absolute;
        left: 50%;
        bottom: calc(max(12px, env(safe-area-inset-bottom)) + 34px);
        transform: translateX(-50%);
        max-width: 62vw;
      }

      .sandbox-btn {
        pointer-events: auto;
        height: 24px;
        padding: 0 7px;
        border-radius: 5px;
        border: 1.5px solid rgba(98, 224, 245, 0.55);
        background: rgba(16, 26, 40, 0.88);
        color: #8df0ff;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.4px;
      }

      .sandbox-btn.mut {
        border-color: rgba(244, 180, 27, 0.55);
        color: #ffd666;
      }

      .sandbox-btn.clr {
        border-color: rgba(224, 60, 74, 0.65);
        color: #ff8d97;
      }

      .sandbox-btn:active {
        transform: scale(0.94);
        background: rgba(52, 144, 240, 0.5);
      }

      /* Replay Skip Bar */
      #touch-replay-bar {
        display: none;
        align-items: center;
        justify-content: center;
      }

      #touch-controls.landscape #touch-replay-bar {
        position: absolute;
        left: 50%;
        bottom: max(54px, calc(env(safe-area-inset-bottom) + 46px));
        transform: translateX(-50%);
      }

      #touch-skip {
        min-width: 170px;
        height: 44px;
        padding: 0 18px;
        border-radius: 10px;
        border: 2px solid #f4b41b;
        background: rgba(20, 28, 42, 0.92);
        color: #ffd666;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.8px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.55);
      }

      #touch-skip:active {
        transform: scale(0.95);
        background: rgba(244, 180, 27, 0.25);
      }

      /* Play Pad (Joystick + Action Cluster) */
      #touch-play-pad {
        position: relative;
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 136px;
        pointer-events: none;
      }

      #touch-controls.landscape #touch-play-pad {
        position: absolute;
        inset: 0;
      }

      #touch-stick-base {
        position: relative;
        width: 120px;
        height: 120px;
        border-radius: 50%;
        border: 3px solid rgba(141, 240, 255, 0.35);
        background: radial-gradient(circle, rgba(22, 32, 48, 0.65) 0%, rgba(11, 14, 20, 0.78) 100%);
        box-shadow: inset 0 0 18px rgba(0, 0, 0, 0.65), 0 0 0 2px rgba(11, 14, 20, 0.75);
      }

      #touch-controls.portrait #touch-stick-base {
        width: 132px;
        height: 132px;
        margin-left: 6px;
      }

      #touch-controls.landscape #touch-stick-base {
        position: absolute;
        left: max(18px, env(safe-area-inset-left));
        bottom: max(18px, env(safe-area-inset-bottom));
        opacity: 0.86;
      }

      .stick-arrow {
        position: absolute;
        color: rgba(180, 210, 240, 0.34);
        font-size: 10px;
        font-weight: bold;
        pointer-events: none;
      }

      .stick-arrow.up {
        top: 6px;
        left: 50%;
        transform: translateX(-50%);
      }

      .stick-arrow.down {
        bottom: 6px;
        left: 50%;
        transform: translateX(-50%);
      }

      .stick-arrow.left {
        left: 7px;
        top: 50%;
        transform: translateY(-50%);
      }

      .stick-arrow.right {
        right: 7px;
        top: 50%;
        transform: translateY(-50%);
      }

      #touch-stick-knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 48px;
        height: 48px;
        margin-left: -24px;
        margin-top: -24px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #ffffff 0%, #9ad9ff 45%, #347ec2 100%);
        border: 2px solid #f4f8ff;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.65);
        pointer-events: none;
      }

      #touch-action-pad {
        position: relative;
        width: 162px;
        height: 140px;
        pointer-events: none;
      }

      #touch-controls.landscape #touch-action-pad {
        position: absolute;
        right: max(18px, env(safe-area-inset-right));
        bottom: max(16px, env(safe-area-inset-bottom));
      }

      .touch-btn {
        position: absolute;
        border-radius: 14px;
        border: 3px solid rgba(255, 255, 255, 0.45);
        color: #ffffff;
        font-weight: 800;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        opacity: 0.9;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.55), 0 8px 18px rgba(0, 0, 0, 0.45);
        transition: transform 0.06s ease, opacity 0.1s ease;
      }

      .touch-btn.pressed {
        transform: translateY(2px) scale(0.94);
        opacity: 1;
        border-color: #ffffff;
      }

      .touch-btn.on-cd {
        opacity: 0.48;
      }

      .touch-btn-sub {
        font-size: 9px;
        font-weight: 700;
        opacity: 0.85;
        letter-spacing: 0.3px;
      }

      #touch-kick {
        right: 4px;
        bottom: 12px;
        width: 78px;
        height: 78px;
        font-size: 14px;
        background: linear-gradient(180deg, rgba(235, 74, 88, 0.92) 0%, rgba(168, 28, 42, 0.92) 100%);
        overflow: hidden;
      }

      #touch-kick-charge {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 0%;
        background: rgba(244, 180, 27, 0.55);
        pointer-events: none;
        z-index: 0;
      }

      #touch-kick > span {
        position: relative;
        z-index: 1;
      }

      #touch-dash {
        right: 92px;
        bottom: 4px;
        width: 66px;
        height: 66px;
        font-size: 12px;
        background: linear-gradient(180deg, rgba(58, 152, 245, 0.92) 0%, rgba(28, 92, 168, 0.92) 100%);
      }

      #touch-switch {
        right: 14px;
        bottom: 98px;
        width: 64px;
        height: 36px;
        border-radius: 9px;
        font-size: 11px;
        background: linear-gradient(180deg, rgba(244, 180, 27, 0.94) 0%, rgba(181, 121, 12, 0.94) 100%);
        color: #0b0e14;
        border-color: rgba(255, 240, 185, 0.85);
      }

      #touch-controls.portrait #touch-kick {
        width: 84px;
        height: 84px;
        bottom: 14px;
      }

      #touch-controls.portrait #touch-dash {
        width: 70px;
        height: 70px;
        right: 98px;
        bottom: 6px;
      }

      #touch-controls.portrait #touch-switch {
        bottom: 106px;
      }
    </style>
  </head>
  <body>
    <div id="game-wrapper">
      <canvas id="game-canvas" width="480" height="270"></canvas>
    </div>

    <div id="touch-controls">
      <div id="touch-utility-bar">
        <button id="touch-pause" type="button" class="touch-pill touch-zone">II PAUSE</button>
        <button id="touch-mute" type="button" class="touch-pill touch-zone">SFX:ON</button>
        <button id="touch-view" type="button" class="touch-pill touch-zone">VIEW:AUTO</button>
      </div>

      <div id="touch-sandbox-bar">
        <button type="button" class="sandbox-btn touch-zone" data-sb="feed">FEED</button>
        <button type="button" class="sandbox-btn touch-zone" data-sb="ball">BALL</button>
        <button type="button" class="sandbox-btn touch-zone" data-sb="def">AI BEK</button>
        <button type="button" class="sandbox-btn mut touch-zone" data-sb="m0">M1:GIANT</button>
        <button type="button" class="sandbox-btn mut touch-zone" data-sb="m1">M2:ICE</button>
        <button type="button" class="sandbox-btn mut touch-zone" data-sb="m2">M3:PIN</button>
        <button type="button" class="sandbox-btn mut touch-zone" data-sb="m3">M4:BOMB</button>
        <button type="button" class="sandbox-btn mut touch-zone" data-sb="m4">M5:WIDE</button>
        <button type="button" class="sandbox-btn mut touch-zone" data-sb="m5">M6:2X</button>
        <button type="button" class="sandbox-btn clr touch-zone" data-sb="clear">CLR</button>
      </div>

      <div id="touch-replay-bar">
        <button id="touch-skip" type="button" class="touch-zone">SKIP REPLAY &gt;&gt;</button>
      </div>

      <div id="touch-play-pad">
        <div id="touch-stick-base" class="touch-zone">
          <span class="stick-arrow up">▲</span>
          <span class="stick-arrow down">▼</span>
          <span class="stick-arrow left">◀</span>
          <span class="stick-arrow right">▶</span>
          <div id="touch-stick-knob"></div>
        </div>

        <div id="touch-action-pad">
          <div id="touch-switch" class="touch-zone touch-btn" style="display: none;">
            <span>SWITCH</span>
          </div>
          <div id="touch-dash" class="touch-zone touch-btn">
            <span id="touch-dash-label">TACKLE</span>
            <span class="touch-btn-sub">STEAL</span>
          </div>
          <div id="touch-kick" class="touch-zone touch-btn">
            <div id="touch-kick-charge"></div>
            <span>KICK</span>
            <span class="touch-btn-sub">HOLD PWR</span>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
